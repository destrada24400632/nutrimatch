<body class="tema-usuario">
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="u-cabecera">

      <a href="#inicio" aria-label="NutriMatch, ir a inicio" data-logo></a>
      <nav class="u-nav" id="u-nav" aria-label="Principal">
        <span class="nav-indicador" id="nav-indicador" aria-hidden="true"></span>
        <a href="#inicio" data-vista="inicio"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
        <a href="#buscar" data-vista="buscar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Buscar nutriólogos</a>
        <a href="#citas" data-vista="citas"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mis citas</a>
        <a href="#mi-perfil" data-vista="mi-perfil"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Mi perfil</a>

      <div class="u-sesion">
        <div class="quien"><strong id="u-nombre"></strong><span>Paciente</span></div>
        <span id="u-avatar"></span>
        <button type="button" class="btn btn-fantasma btn-sm btn-salir" id="btn-salir" aria-label="Cerrar sesión">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 16l4-4-4-4M20 12H10"/></svg><span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  </header>

  <main id="contenido" class="app-main">
    <div class="contenedor">
      <div id="vista" class="vista"></div>
    </div>
  </main>

  <footer class="app-pie">
    <div class="contenedor">
      <p><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Prototipo de demostración: sesión simulada, sin base de datos.</p>
      <button type="button" class="btn btn-fantasma btn-sm" data-reiniciar-demo>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Reiniciar demo

    </div>
  </footer>

  <nav class="u-tabbar" id="u-tabbar" aria-label="Principal (móvil)">

    <a href="#buscar" data-vista="buscar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Buscar</a>

    <a href="#mi-perfil" data-vista="mi-perfil"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Mi perfil</a>
